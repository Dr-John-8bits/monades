name: Publish browsable Mutable Dreams 1.1 source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-browsable-source-1-1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the existing release repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Expand verified source and add build documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from hashlib import sha256
          import base64, json, subprocess

          root = Path.cwd()
          archive = root / "Mutable-Dreams-1.1-Source.zip"
          assert sha256(archive.read_bytes()).hexdigest() == "90fef68214bd1ff6674db2c80852cc2291b31321e9c26cb20cf59d45ee04af40", "Unexpected source archive"
          firmware = root / "Mutable-Dreams-1.1.0.fwsc"
          assert sha256(firmware.read_bytes()).hexdigest() == "8e039bb0e9681fbbb0504e9b7d251895958fd88ae97f11ff0342b4aef38143d2", "Unexpected release firmware"
          unchanged = {p: sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file() and p.name not in ("README.md", "FIRMWARE-HUB.json", "LICENSING-GPL.txt")}
          with ZipFile(archive) as z:
              files = [e for e in z.infolist() if not e.is_dir()]
              assert len(files) == 807, "Unexpected archive contents"
              for entry in files:
                  parts = PurePosixPath(entry.filename).parts
                  assert parts[0] == "mutable-dreams-1.1" and ".." not in parts and ".git" not in parts, "Unsafe archive path"
                  relative = PurePosixPath(*parts[1:]).as_posix()
                  if relative == "README.md":
                      relative = "docs/release-1.1/README-from-source-archive.md"
                  target = root / relative
                  data = z.read(entry)
                  if target.exists() and target.read_bytes() != data:
                      assert relative == "LICENSING-GPL.txt" and data.endswith(target.read_bytes()), "Conflicting existing source file"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          payload = {'README.md': '', 'BUILDING.md': '', 'SOURCE-PUBLICATION.md': '', 'FIRMWARE-HUB.json': '', 'tools/verify_published_source.py': ''}
          for name, data in payload.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data))
          subprocess.run(["python3", "tools/verify_published_source.py"], check=True)
          for path, expected in unchanged.items():
              assert sha256(path.read_bytes()).hexdigest() == expected, f"Existing release asset changed: {path}"
          # This is a one-time source import; keep its audit trail in Git history only.
          (root / ".github/workflows/publish-browsable-source.yml").unlink()
          print("Verified complete 1.1 source; all existing release assets preserved.")
          PY
      - name: Publish source without changing release tags or assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Publish complete Mutable Dreams 1.1 source tree"
          git push origin HEAD:main
